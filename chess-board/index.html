<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chess-container">

        <!-- Top Alphabets -->
        <div class="top-labels">
            <span></span>
            <span>A</span>
            <span>B</span>
            <span>C</span>
            <span>D</span>
            <span>E</span>
            <span>F</span>
            <span>G</span>
            <span>H</span>
            <span></span>
        </div>


        <div class="board-row">

            <!-- Left Numbers -->
            <div class="side-labels">
                <span>8</span>
                <span>7</span>
                <span>6</span>
                <span>5</span>
                <span>4</span>
                <span>3</span>
                <span>2</span>
                <span>1</span>
            </div>


            <!-- Chess Board -->
            <div class="board">

                <!-- Row 8 - Black Pieces -->
                <div>♜</div>
                <div class="black">♞</div>
                <div>♝</div>
                <div class="black">♛</div>
                <div>♚</div>
                <div class="black">♝</div>
                <div>♞</div>
                <div class="black">♜</div>

                <!-- Row 7 - Black Pawns -->
                <div class="black">♟</div>
                <div>♟</div>
                <div class="black">♟</div>
                <div>♟</div>
                <div class="black">♟</div>
                <div>♟</div>
                <div class="black">♟</div>
                <div>♟</div>

                <!-- Row 6 -->
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>

                <!-- Row 5 -->
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>

                <!-- Row 4 -->
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>

                <!-- Row 3 -->
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>
                <div class="black"></div>
                <div></div>

                <!-- Row 2 - White Pawns -->
                <div>♙</div>
                <div class="black">♙</div>
                <div>♙</div>
                <div class="black">♙</div>
                <div>♙</div>
                <div class="black">♙</div>
                <div>♙</div>
                <div class="black">♙</div>

                <!-- Row 1 - White Pieces -->
                <div>♖</div>
                <div class="black">♘</div>
                <div>♗</div>
                <div class="black">♕</div>
                <div>♔</div>
                <div class="black">♗</div>
                <div>♘</div>
                <div class="black">♖</div>

            </div>


            <!-- Right Numbers -->
            <div class="side-labels">
                <span>8</span>
                <span>7</span>
                <span>6</span>
                <span>5</span>
                <span>4</span>
                <span>3</span>
                <span>2</span>
                <span>1</span>
            </div>

        </div>


        <!-- Bottom Alphabets -->
        <div class="bottom-labels">
            <span></span>
            <span>A</span>
            <span>B</span>
            <span>C</span>
            <span>D</span>
            <span>E</span>
            <span>F</span>
            <span>G</span>
            <span>H</span>
            <span></span>
        </div>

    </div>

</body>
</html>
