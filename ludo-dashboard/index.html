<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ludo Board</title>
<style>
  :root{
    --green:#159c47;
    --yellow:#ffd400;
    --red:#e8232a;
    --blue:#1e3ea8;
    --cell:40px;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eef1f5;
    font-family:Arial, sans-serif;
  }
  .board{
    position:relative;
    width:calc(var(--cell)*15);
    height:calc(var(--cell)*15);
    display:grid;
    grid-template-columns:repeat(15, var(--cell));
    grid-template-rows:repeat(15, var(--cell));
    border:4px solid #000;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    background:#fff;
  }
  .cell{
    border:1px solid #000;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
  }
  .track{background:#fff;}
  .green-lane{background:var(--green);}
  .yellow-lane{background:var(--yellow);}
  .red-lane{background:var(--red);}
  .blue-lane{background:var(--blue);}
  .star{color:#000;font-size:20px;}
  .arrow{font-size:20px;color:#000;}

  .base{
    position:relative;
    border:1px solid #000;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .green-base{background:var(--green);}
  .yellow-base{background:var(--yellow);}
  .red-base{background:var(--red);}
  .blue-base{background:var(--blue);}

  .inner-box{
    width:66%;
    height:66%;
    background:#fff;
    border:3px solid #000;
    border-radius:6px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:10%;
    padding:12%;
    box-sizing:border-box;
  }
  .token{
    border-radius:50%;
    border:2px solid #000;
  }
  .token.green{background:var(--green);}
  .token.yellow{background:var(--yellow);}
  .token.red{background:var(--red);}
  .token.blue{background:var(--blue);}

  .center-triangle{
    position:relative;
    border:1px solid #000;
    box-sizing:border-box;
    background:
      conic-gradient(
        from 0deg at 50% 50%,
        var(--yellow) 0deg 90deg,
        var(--blue) 90deg 180deg,
        var(--red) 180deg 270deg,
        var(--green) 270deg 360deg
      );
  }
</style>
</head>
<body>

<div class="board" id="board">
  <div class="base green-base" style="grid-column:1/span 6; grid-row:1/span 6;">
    <div class="inner-box">
      <div class="token green"></div>
      <div class="token green"></div>
      <div class="token green"></div>
      <div class="token green"></div>
    </div>
  </div>

  <div class="base yellow-base" style="grid-column:10/span 6; grid-row:1/span 6;">
    <div class="inner-box">
      <div class="token yellow"></div>
      <div class="token yellow"></div>
      <div class="token yellow"></div>
      <div class="token yellow"></div>
    </div>
  </div>

  <div class="base red-base" style="grid-column:1/span 6; grid-row:10/span 6;">
    <div class="inner-box">
      <div class="token red"></div>
      <div class="token red"></div>
      <div class="token red"></div>
      <div class="token red"></div>
    </div>
  </div>

  <div class="base blue-base" style="grid-column:10/span 6; grid-row:10/span 6;">
    <div class="inner-box">
      <div class="token blue"></div>
      <div class="token blue"></div>
      <div class="token blue"></div>
      <div class="token blue"></div>
    </div>
  </div>

  <div class="center-triangle" style="grid-column:7/span 3; grid-row:7/span 3;"></div>
</div>

<script>
const board = document.getElementById('board');

function makeCell(r, c, cls, content){
  const d = document.createElement('div');
  d.className = 'cell ' + cls;
  d.style.gridRow = (r+1);
  d.style.gridColumn = (c+1);
  if(content) d.innerHTML = content;
  board.appendChild(d);
}

for(let r=0; r<15; r++){
  for(let c=0; c<15; c++){
    // skip the four base regions
    if((r<6 && c<6) || (r<6 && c>8) || (r>8 && c<6) || (r>8 && c>8)) continue;
    // skip center 3x3
    if(r>=6 && r<=8 && c>=6 && c<=8) continue;

    let cls = 'track';
    let content = '';

    if(c===7 && r<6){
      cls = 'yellow-lane';
      if(r===0) content = '<span class="arrow">&#9660;</span>';
    } else if(c===7 && r>8){
      cls = 'red-lane';
      if(r===14) content = '<span class="arrow">&#9650;</span>';
    } else if(r===7 && c<6){
      cls = 'green-lane';
      if(c===0) content = '<span class="arrow">&#9654;</span>';
    } else if(r===7 && c>8){
      cls = 'blue-lane';
      if(c===14) content = '<span class="arrow">&#9664;</span>';
    } else if(r===2 && c===6){
      cls = 'track star'; content = '&#9733;';
    } else if(r===6 && c===2){
      cls = 'track star'; content = '&#9733;';
    } else if(r===8 && c===12){
      cls = 'track star'; content = '&#9733;';
    } else if(r===12 && c===8){
      cls = 'track star'; content = '&#9733;';
    }

    makeCell(r, c, cls, content);
  }
}
</script>

</body>
</html>
